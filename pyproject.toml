[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webguard"
version = "1.0.0"
description = "Passive OWASP Top 10 web vulnerability scanner"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "James Gichia", email = "jamesgichia15@gmail.com" }]
keywords = ["security", "owasp", "scanner", "vulnerability", "passive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
requires-python = ">=3.11"
dependencies = [
    # HTTP client — async-native, used for all outbound scan requests
    "httpx>=0.27",
    # API framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # Task queue
    "celery>=5.4",
    "redis>=5.0",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",        # async PostgreSQL driver
    "psycopg2-binary>=2.9", # sync driver for Alembic env
    # CLI
    "typer>=0.12",
    "rich>=13",
    # Reports
    "weasyprint>=62",
    "jinja2>=3.1",
    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4",
    "python-multipart>=0.0.9",
    # Config
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # DNS checks
    "dnspython>=2.6",
    # TLS inspection
    "cryptography>=42",
    # Rate limiting
    "slowapi>=0.1.9",
    # Error monitoring
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",       # mock httpx calls in tests
    "factory-boy>=3.3",  # test data factories
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    # Mypy type stubs
    "types-redis>=4.6",
    "types-passlib>=1.7",
    "types-python-jose>=3.3",
]

[project.scripts]
webguard = "cli.main:app"

[project.urls]
Homepage = "https://github.com/jamesgichia/webguard"
Repository = "https://github.com/jamesgichia/webguard"
Issues = "https://github.com/jamesgichia/webguard/issues"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501", # line length — handled by Black
]

[tool.ruff.lint.isort]
known-first-party = ["engine", "cli", "api"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/", "alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-v",
    "--cov=engine",
    "--cov=cli",
    "--cov=api",
    "--cov-report=term-missing",
    "--cov-fail-under=0",  # raised to 80 once engine is complete
]

[tool.coverage.run]
omit = [
    "tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.hatch.build.targets.wheel]
packages = ["engine", "cli", "api"]
