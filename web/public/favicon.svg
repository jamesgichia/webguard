<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Shield body with gradient -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f7fa" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Shield path -->
  <path
    d="M16 2L4 7v9c0 6.627 5.148 11.742 12 13 6.852-1.258 12-6.373 12-13V7L16 2z"
    fill="url(#shieldGrad)"
  />

  <!-- Inner shield highlight -->
  <path
    d="M16 4.5L6 9v7c0 5.3 4.12 9.4 9.6 10.5 0.13 0.02 0.27 0.02 0.4 0V4.5z"
    fill="white"
    fill-opacity="0.08"
  />

  <!-- Checkmark / tick -->
  <path
    d="M10.5 16l3.5 3.5 7-7"
    stroke="url(#checkGrad)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>